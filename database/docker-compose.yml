services:
  postgres:
    image: postgres:16-alpine
    container_name: sih26190-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sih26190
      POSTGRES_USER: sih_user
      POSTGRES_PASSWORD: sih_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ./seeds/demo_users.sql:/docker-entrypoint-initdb.d/002_demo_users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sih_user -d sih26190"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
